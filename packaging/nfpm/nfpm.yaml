# nfpm config for the .deb and .rpm packages. Built by packaging/build-release.sh,
# which exports NFPM_VERSION and NFPM_STAGE (directory prepared by the script).
name: thetimer
arch: amd64
platform: linux
version: ${NFPM_VERSION}
release: 1
section: utils
priority: optional
maintainer: msozturktr <msozturk@gmail.com>
description: |
  Time tracking, countdown and daily planning application.
  Stopwatch, countdown and Pomodoro timers with a daily plan view and weekly report.
vendor: msozturktr
homepage: https://github.com/msozturktr/TheTimer
license: MIT

contents:
  - src: ${NFPM_STAGE}/app
    dst: /usr/lib/thetimer
    type: tree
    expand: true
  - src: /usr/lib/thetimer/TheTimer
    dst: /usr/bin/thetimer
    type: symlink
  - src: ${NFPM_STAGE}/io.github.msozturktr.TheTimer.desktop
    dst: /usr/share/applications/io.github.msozturktr.TheTimer.desktop
    expand: true
    file_info:
      mode: 0644
  - src: packaging/linux/thetimer.png
    dst: /usr/share/icons/hicolor/256x256/apps/thetimer.png
    file_info:
      mode: 0644
  - src: packaging/flatpak/io.github.msozturktr.TheTimer.metainfo.xml
    dst: /usr/share/metainfo/io.github.msozturktr.TheTimer.metainfo.xml
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/thetimer/copyright
    file_info:
      mode: 0644

# The app is self-contained (.NET runtime bundled; SQLite native lib ships in the
# publish output). It still needs fontconfig, X11 client libs and ICU at runtime.
overrides:
  deb:
    depends:
      - libc6
      - libfontconfig1
      - libx11-6
      - libice6
      - libsm6
      - libicu76 | libicu74 | libicu72 | libicu70 | libicu67 | libicu66
  rpm:
    depends:
      - fontconfig
      - libX11
      - libICE
      - libSM
      - libicu
