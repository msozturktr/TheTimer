name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without leading v)'
        required: true

permissions:
  contents: read

env:
  NFPM_VERSION: 2.47.0
  NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
  APPIMAGETOOL_VERSION: 1.9.1

jobs:
  packages:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test --configuration Release

      - name: Install nfpm
        run: |
          curl -fsSL -o nfpm.tgz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf nfpm.tgz -C "$RUNNER_TEMP/bin" nfpm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install appimagetool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bin/appimagetool" "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/bin/appimagetool"

      - name: Build packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: packaging/build-release.sh "${{ steps.ver.outputs.version }}" tar deb rpm appimage

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages
          path: artifacts/release/*
          if-no-files-found: error

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Build bundle
        run: packaging/build-release.sh "${{ steps.ver.outputs.version }}" flatpak

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: flatpak
          path: artifacts/release/*.flatpak
          if-no-files-found: error

  release:
    needs: [packages, flatpak]
    # Publish whatever was built even if the flatpak job failed.
    if: ${{ !cancelled() && needs.packages.result == 'success' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
